<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif"><defs><marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2f9e6e"/></marker><marker id="ah-pink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e05561"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#4285f4"/></marker><marker id="ah-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8b5cf6"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#e0a13a"/></marker><marker id="ah-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#2aa5b0"/></marker><marker id="ah-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#8494ab"/></marker><marker id="ah-white" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1.2 L9,5 L0,8.8 z" fill="#c9d3e2"/></marker><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1b2a4a" flood-opacity="0.10"/></filter></defs><rect width="1600" height="980" fill="#fbfcfe"/><text x="800.0" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#16203a">GuardianForge - runtime governance for agent fleets</text><text x="800.0" y="80" text-anchor="middle" font-size="14.5" fill="#6b7794">Deterministic code detects, decides the envelope, and enforces - the model only synthesizes a decision, validated before it can act.</text><rect x="48" y="150" width="300" height="320" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="66" y="141" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">SOURCES</text><rect x="68" y="196" width="260" height="87" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(84,211) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.6L20 11l-5.8 2.4L12 19l-2.2-5.6L4 11l5.8-2.4z"/></g><text x="114" y="227" font-size="16.5" font-weight="700" fill="#136b74">Agent event</text><text x="85" y="249.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">POST /events or scenario run</text><text x="85" y="266.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">agent_id . type . tool</text><rect x="68" y="336" width="260" height="87" rx="14" fill="#ddf3f5" stroke="#2aa5b0" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(84,351) scale(0.8750)" fill="none" stroke="#2aa5b0" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"/><path d="M2 20c0-3.9 3.1-6.4 7-6.4s7 2.5 7 6.4"/><path d="M16 5.2A3.4 3.4 0 0 1 16 11"/><path d="M18 13.9c2.4.6 4 2.5 4 5.1"/></g><text x="114" y="367" font-size="16.5" font-weight="700" fill="#136b74">Monitored fleet</text><text x="85" y="389.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">synthetic agent fleet</text><text x="85" y="406.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">the system being governed</text><rect x="392" y="150" width="486" height="320" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#4285f4" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="410" y="141" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#17509f">DETERMINISTIC CORE - DETECT FIRST</text><rect x="414" y="190" width="442" height="87" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(430,205) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16"/><path d="M6 8h12"/><path d="M4 18h6l-3-7z"/><path d="M14 18h6l-3-7z"/></g><text x="460" y="221" font-size="16.5" font-weight="700" fill="#17509f">Policy evaluator</text><text x="431" y="243.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">equality . contains . regexp . counts</text><text x="431" y="260.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">OBSERVE . SOFT . HARD . ESCALATE</text><rect x="414" y="286" width="442" height="87" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(430,301) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a6 6 0 0 1 6-6h8"/><path d="M15 1l3 3-3 3"/><path d="M20 14a6 6 0 0 1-6 6H6"/><path d="M9 23l-3-3 3-3"/></g><text x="460" y="317" font-size="16.5" font-weight="700" fill="#17509f">Anomaly workers</text><text x="431" y="339.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">loops . rate spikes . cyclic A-B-A-B</text><text x="431" y="356.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">scored per agent</text><rect x="414" y="382" width="442" height="69" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(430,397) scale(0.8750)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.4 8.2-8 9-4.6-.8-8-4-8-9V6z"/></g><text x="460" y="413" font-size="16.5" font-weight="700" fill="#17509f">Trust scorer</text><text x="431" y="435.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">running per-agent score; low = signal</text><rect x="946" y="246" width="210" height="136" rx="14" fill="#eef1f6" stroke="#8494ab" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1039.0,260) scale(1.0000)" fill="none" stroke="#8494ab" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3v5a5 5 0 0 0 5 5h7"/><path d="M6 21v-5a5 5 0 0 1 5-5"/><path d="M15 10l3 3-3 3"/></g><text x="1051.0" y="304" text-anchor="middle" font-size="16.5" font-weight="700" fill="#3d4a63">Signal (runtime)</text><text x="1051.0" y="325.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">aggregated into one</text><text x="1051.0" y="342.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">posture + trust score</text><text x="1051.0" y="360.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">no-policy anomaly -&gt; SOFT</text><rect x="1300" y="150" width="252" height="620" rx="18" fill="#ffffff" fill-opacity="0.55" stroke="#8494ab" stroke-width="1.5" stroke-dasharray="7 5" stroke-opacity="0.75"/><text x="1318" y="141" font-size="13.5" font-weight="700" letter-spacing="0.4" fill="#3d4a63">AUDIT . HUMANS</text><rect x="1320" y="196" width="212" height="104" rx="14" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1336,211) scale(0.8750)" fill="none" stroke="#2f9e6e" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9h14M5 15h14M10 3L8 21M17 3l-2 18"/></g><text x="1366" y="227" font-size="16.5" font-weight="700" fill="#186547">Audit chain</text><text x="1337" y="249.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">SHA-256 hash-chained</text><text x="1337" y="266.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">every decision + action</text><text x="1337" y="284.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">Verify catches reorder</text><rect x="1320" y="388" width="212" height="96" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1336,403) scale(0.8750)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6"/><path d="M9 17h4"/></g><text x="1366" y="419" font-size="16.5" font-weight="700" fill="#552fae">Audit Explainer</text><text x="1337" y="441.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">the model explains the</text><text x="1337" y="458.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">trail on demand</text><rect x="1320" y="560" width="212" height="104" rx="14" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1336,575) scale(0.8750)" fill="none" stroke="#e0a13a" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></g><text x="1366" y="591" font-size="16.5" font-weight="700" fill="#8c5a0d">HITL queue</text><text x="1337" y="613.0" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">escalations + rejects</text><text x="1337" y="630.8" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">a human decides</text><text x="1337" y="648.6" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">fail-safe default</text><rect x="392" y="520" width="250" height="176" rx="14" fill="#ece5f9" stroke="#8b5cf6" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(505.0,534) scale(1.0000)" fill="none" stroke="#8b5cf6" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.2 5.6L20 11l-5.8 2.4L12 19l-2.2-5.6L4 11l5.8-2.4z"/></g><text x="517.0" y="578" text-anchor="middle" font-size="16.5" font-weight="700" fill="#552fae">Supervisor (LLM)</text><text x="517.0" y="599.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">the one model step</text><text x="517.0" y="616.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">synthesizes a decision</text><text x="517.0" y="634.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">ambiguous cases only</text><text x="517.0" y="652.4" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">never sets state / fleet</text><rect x="700" y="520" width="236" height="176" rx="14" fill="#fde5e7" stroke="#e05561" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(806.0,534) scale(1.0000)" fill="none" stroke="#e05561" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></g><text x="818.0" y="578" text-anchor="middle" font-size="16.5" font-weight="700" fill="#9e2b36">Validate</text><text x="818.0" y="599.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">known intervention type?</text><text x="818.0" y="616.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">allowed in this mode?</text><text x="818.0" y="634.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">OBSERVE never acts</text><text x="818.0" y="652.4" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">reject -&gt; fail safe</text><rect x="994" y="520" width="250" height="176" rx="14" fill="#e2ecfd" stroke="#4285f4" stroke-width="1.8" filter="url(#sh)"/><g transform="translate(1107.0,534) scale(1.0000)" fill="none" stroke="#4285f4" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></g><text x="1119.0" y="578" text-anchor="middle" font-size="16.5" font-weight="700" fill="#17509f">Executor</text><text x="1119.0" y="599.0" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">PAUSE . REVOKE_TOOL</text><text x="1119.0" y="616.8" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">INJECT_CONSTRAINT</text><text x="1119.0" y="634.6" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">FORCE_REPLAN . NOTIFY</text><text x="1119.0" y="652.4" text-anchor="middle" font-size="12.3" fill="#6b7794" font-family="Segoe UI,Inter,system-ui,-apple-system,sans-serif">applied to the fleet</text><path d="M348,250 L392,250" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><rect x="343.512" y="238.0" width="52.976" height="24.0" rx="12" fill="#ffffff" stroke="#8494ab" stroke-opacity="0.4"/><text x="370.0" y="254.44" text-anchor="middle" font-size="12" font-weight="600" fill="#3d4a63">event</text><path d="M878,305 L946,305" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="883.424" y="293.0" width="57.152" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="912.0" y="309.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">signal</text><path d="M1051,364 L1051.0,481.0 Q1051,496 1036.0,496.0 L529.0,496.0 Q517,496 517.0,508.0 L517,520" stroke="#8494ab" stroke-width="2.0" fill="none" marker-end="url(#ah-slate)"/><rect x="724.5360000000001" y="484.0" width="118.928" height="24.0" rx="12" fill="#ffffff" stroke="#8494ab" stroke-opacity="0.4"/><text x="784" y="500.44" text-anchor="middle" font-size="12" font-weight="600" fill="#3d4a63">decision needed</text><path d="M642,608 L700,608" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="635.224" y="596.0" width="71.55199999999999" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="671.0" y="612.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">decision</text><path d="M936,608 L994,608" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="932.824" y="596.0" width="64.352" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="965.0" y="612.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">allowed</text><path d="M1244,560 L1254.0,560.0 Q1264,560 1264.0,550.0 L1264.0,259.0 Q1264,244 1279.0,244.0 L1320,244" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)"/><rect x="1232.4" y="390.0" width="63.199999999999996" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="1264" y="406.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">record</text><path d="M818,696 L818.0,721.0 Q818,736 833.0,736.0 L1257.0,736.0 Q1272,736 1272.0,721.0 L1272.0,627.0 Q1272,612 1287.0,612.0 L1320,612" stroke="#e05561" stroke-width="2.0" fill="none" marker-end="url(#ah-pink)"/><rect x="949.384" y="724.0" width="121.232" height="24.0" rx="12" fill="#ffffff" stroke="#e05561" stroke-opacity="0.4"/><text x="1010" y="740.44" text-anchor="middle" font-size="12" font-weight="600" fill="#9e2b36">escalate / reject</text><path d="M994,660 L955.0,660.0 Q940,660 940.0,675.0 L940.0,749.0 Q940,764 925.0,764.0 L213.0,764.0 Q198,764 198.0,749.0 L198,414" stroke="#4285f4" stroke-width="2.0" fill="none" marker-end="url(#ah-blue)" stroke-dasharray="7 5"/><rect x="483.184" y="752.0" width="171.63199999999998" height="24.0" rx="12" fill="#ffffff" stroke="#4285f4" stroke-opacity="0.4"/><text x="569" y="768.44" text-anchor="middle" font-size="12" font-weight="600" fill="#17509f">enforce . pause / revoke</text><path d="M1426,292 L1426,388" stroke="#8b5cf6" stroke-width="2.0" fill="none" marker-end="url(#ah-purple)"/><rect x="1393.824" y="328.0" width="64.352" height="24.0" rx="12" fill="#ffffff" stroke="#8b5cf6" stroke-opacity="0.4"/><text x="1426.0" y="344.44" text-anchor="middle" font-size="12" font-weight="600" fill="#552fae">explain</text><rect x="48" y="812" width="730" height="95.19999999999999" rx="11" fill="#fdf1d6" stroke="#e0a13a" stroke-width="1.4" stroke-opacity="0.8"/><text x="64" y="836" font-size="13.2" font-weight="700" fill="#8c5a0d">Observe-first - never silently disruptive</text><text x="64" y="858" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">Interventions fire only under SOFT / HARD / ESCALATE policies.</text><text x="64" y="876.4" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">An anomaly with no matching policy is raised to at most a SOFT</text><text x="64" y="894.8" font-size="12.4" fill="#8c5a0d" fill-opacity="0.92">response - never silently ignored, and never silently disruptive.</text><rect x="822" y="812" width="730" height="95.19999999999999" rx="11" fill="#e3f5ec" stroke="#2f9e6e" stroke-width="1.4" stroke-opacity="0.8"/><text x="838" y="836" font-size="13.2" font-weight="700" fill="#186547">Two systems, one deterministic core</text><text x="838" y="858" font-size="12.4" fill="#186547" fill-opacity="0.92">Full systems in Go and C#; the deterministic core is also ported to</text><text x="838" y="876.4" font-size="12.4" fill="#186547" fill-opacity="0.92">Python, Rust, Java, and TypeScript - same policy, anomaly, trust and</text><text x="838" y="894.8" font-size="12.4" fill="#186547" fill-opacity="0.92">scorecard logic, with rounding rules pinned by tests across every port.</text><text x="800.0" y="962" text-anchor="middle" font-size="12" fill="#6b7794">parag-labs/guardianforge</text></svg>